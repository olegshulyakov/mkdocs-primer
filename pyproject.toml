[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-primer"
version = "0.4.2"
description = "A MkDocs theme built on GitHub's Primer design system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Oleg Shulyakov", email = "oleg.shulyakov@gmail.com" },
]
keywords = ["mkdocs", "mkdocs-theme", "primer", "github", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mkdocs >= 1.6, < 2",
    "pygments >= 2.16",
]

[project.urls]
Homepage = "https://github.com/olegshulyakov/mkdocs-primer"
Source = "https://github.com/olegshulyakov/mkdocs-primer"
Issues = "https://github.com/olegshulyakov/mkdocs-primer/issues"

[project.entry-points."mkdocs.themes"]
primer = "mkdocs_primer"

[project.entry-points."mike.themes"]
primer = "mkdocs_primer_mike"

[dependency-groups]
docs = [
    "pymdown-extensions >= 10",
    "mkdocs-awesome-nav >= 3",
    "mkdocs-section-index >= 0.3.9",
    "mkdocs-static-i18n >= 1.2",
    "mkdocs-git-revision-date-localized-plugin >= 1.2",
    "mkdocs-git-authors-plugin >= 0.7",
    "mkdocs-glightbox >= 0.4",
    "mkdocs-macros-plugin >= 1.0",
    "mkdocs-mermaid2-plugin >= 1.1",
    "mkdocs-charts-plugin >= 0.0.10",
    "mkdocs-minify-plugin >= 0.8",
    "mkdocs-redirects >= 1.2",
    "mkdocstrings[python] >= 0.25",
    "mkdocs-rss-plugin >= 1.12",
    "mkdocs-gen-files >= 0.5",
    "mkdocs-literate-nav >= 0.6",
]
i18n = ["babel == 2.18.0"]
dev = [{ include-group = "docs" }, { include-group = "i18n" }]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.10" }

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_primer", "mkdocs_primer_mike"]

[tool.hatch.build.targets.sdist]
include = [
    "/mkdocs_primer",
    "/mkdocs_primer_mike",
    "/scripts",
    "/package.json",
    "/README.md",
    "/LICENSE",
]

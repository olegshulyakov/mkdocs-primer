[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-primer"
version = "0.1.2"
description = "A MkDocs theme built on GitHub's Primer design system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Oleg Shulyakov", email = "oleg.shulyakov@gmail.com" },
]
keywords = ["mkdocs", "mkdocs-theme", "primer", "github", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mkdocs >= 1.6",
    # MkDocs does not require Pygments, but without it the code blocks this
    # theme styles are emitted untokenized and css/pygments.css does nothing.
    "pygments >= 2.16",
]

[project.urls]
Homepage = "https://github.com/olegshulyakov/mkdocs-primer"
Source = "https://github.com/olegshulyakov/mkdocs-primer"
Issues = "https://github.com/olegshulyakov/mkdocs-primer/issues"

[project.entry-points."mkdocs.themes"]
primer = "mkdocs_primer"

# mike resolves a theme's version-selector assets through this group and builds
# no selector at all, without warning, for a theme it cannot find here.
[project.entry-points."mike.themes"]
primer = "mkdocs_primer_mike"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_primer", "mkdocs_primer_mike"]

[tool.hatch.build.targets.sdist]
include = [
    "/mkdocs_primer",
    "/mkdocs_primer_mike",
    "/scripts",
    "/package.json",
    "/README.md",
    "/LICENSE",
]

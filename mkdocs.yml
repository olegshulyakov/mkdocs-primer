site_name: MkDocs Primer Theme
site_description: A MkDocs theme built on GitHub's Primer design system
site_url: https://olegshulyakov.github.io/mkdocs-primer/

repo_url: https://github.com/olegshulyakov/mkdocs-primer
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Oleg Shulyakov

theme:
  name: primer
  social:
    - service: github
      link: https://github.com/olegshulyakov/mkdocs-primer
    - service: pypi
      link: https://pypi.org/project/mkdocs-primer/

hooks:
  - hooks.py

plugins:
  - search:
      lang: [en, es, zh, pt, ru, fr]

  - awesome-nav

  - i18n:
      docs_structure: suffix
      reconfigure_search: false
      languages:
        - locale: es
          name: Spanish
          build: true
          theme:
            locale: es
          nav_translations:
            Guide: Guía
            Nested: Anidado
        - locale: zh
          name: Chinese
          build: true
          theme:
            locale: zh
          nav_translations:
            Guide: 指南
            Nested: 嵌套
        - locale: hi
          name: Hindi
          build: true
          theme:
            locale: hi
          nav_translations:
            Guide: गाइड
            Nested: नेस्टेड
        - locale: pt
          name: Portuguese
          build: true
          theme:
            locale: pt
          nav_translations:
            Guide: Guia
            Nested: Aninhado
        - locale: ru
          name: Russian
          build: true
          theme:
            locale: ru
          nav_translations:
            Guide: Руководство
            Nested: Вложенный раздел
        - locale: fr
          name: French
          build: true
          theme:
            locale: fr
          nav_translations:
            Guide: Guide
            Nested: Imbrication
        - locale: en
          default: true
          name: English
          build: true
          theme:
            locale: en

  - section-index

  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: true

  - git-authors

  - glightbox

  - mkdocstrings:
      handlers:
        python:
          paths: ['.']

  - macros

  - redirects:
      redirect_maps:
        options.md: guide/configuration.md
        another-page.md: index.md

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: ""
      permalink_class: anchor
      permalink_leading: true
      permalink_title: Permanent link
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tilde

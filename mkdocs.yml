site_name: mkdocs-primer
site_description: A MkDocs theme built on GitHub's Primer design system
site_url: https://olegshulyakov.github.io/mkdocs-primer/

repo_url: https://github.com/olegshulyakov/mkdocs-primer
edit_uri: edit/main/docs/

theme:
  name: primer

# Drops one false-positive warning from mkdocs-section-index so `--strict` stays
# usable. See the docstring in hooks.py.
hooks:
  - hooks.py

# This site doubles as the theme's plugin compatibility test: every plugin that
# needs something from a theme is enabled here, and CI builds with `--strict`.
# docs/guide/plugins.md explains what each one is here to prove.
plugins:
  # Built in. The theme renders the header search box and the plugin supplies
  # search/main.js only when this plugin is enabled.
  - search:
      # MkDocs does not ship wordcut.js, required by its Hindi Lunr adapter.
      # Keep Hindi pages in the shared index without loading the broken adapter.
      lang: [en, es, zh, pt, ru, fr]

  # Nav comes from docs/.nav.yml instead of a `nav:` key below. Must run before
  # section-index, which rewrites the nav it produces.
  - awesome-nav

  # Extra locales under /es/, /zh/, /hi/, /pt/, /ru/ and /fr/.
  # `docs_structure: suffix` means installation.ru.md. Pages with no translation
  # fall back to their English source.
  - i18n:
      docs_structure: suffix
      # Do not let i18n re-add Hindi to the search adapter list above.
      reconfigure_search: false
      # `theme.locale` per language is what switches the theme's own chrome
      # (Search, Back to top, Previous/Next...) to that language. The plugin
      # only sets it automatically for the themes MkDocs itself ships, so a
      # third-party theme needs it spelled out. See mkdocs_primer/locales/.
      #
      # `en` is listed last on purpose. One build pass runs per language and
      # the pages that exist once for the whole site — 404.html and search.html
      # — are rewritten by every pass, so the last language wins them. Putting
      # the default language last leaves those two in English. The theme sorts
      # the language selector itself, so this does not affect its order.
      languages:
        - locale: es
          name: Spanish
          build: true
          theme:
            locale: es
        - locale: zh
          name: Chinese
          build: true
          theme:
            locale: zh
        - locale: hi
          name: Hindi
          build: true
          theme:
            locale: hi
        - locale: pt
          name: Portuguese
          build: true
          theme:
            locale: pt
        - locale: ru
          name: Russian
          build: true
          theme:
            locale: ru
        - locale: fr
          name: French
          build: true
          theme:
            locale: fr
        - locale: en
          default: true
          name: English
          build: true
          theme:
            locale: en

  # Folds docs/guide/index.md into the Guide section itself, so a nav item ends
  # up with both children and a url. Runs after the other nav plugins, or its
  # rewrite is thrown away.
  - section-index

  # Sets page.meta.git_revision_date_localized, which the theme footer prints.
  - git-revision-date-localized:
      # A shallow clone or a fresh working copy has no log for a page; fall back
      # rather than failing the build.
      fallback_to_build_date: true

  # Puts `git_page_authors` on the page context, which the footer prints too.
  - git-authors

  # Wraps content images in a lightbox by rewriting the page HTML.
  - glightbox

  # Renders docs/reference.md from the theme package's docstring.
  - mkdocstrings:
      handlers:
        python:
          paths: ['.']

  # Jinja in Markdown; docs/guide/plugins.md uses it for config values.
  - macros

  # The Configuration page used to live at /options/.
  - redirects:
      redirect_maps:
        options.md: guide/configuration.md

  # Last: it rewrites the HTML every other plugin produced.
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - tables
  - toc:
      # Empty permalink text: theme.css draws the octicon via ::before, and an
      # empty anchor keeps the glyph out of the search index.
      permalink: ""
      permalink_class: anchor
      permalink_leading: true
      permalink_title: Permanent link
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tilde

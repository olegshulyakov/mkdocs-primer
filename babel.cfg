# Extraction map for the theme's translatable strings.
#   pybabel extract -F babel.cfg -o mkdocs_primer/locales/messages.pot mkdocs_primer
# The template belongs under locales/ because MkDocs treats every other file in
# a theme directory as a static asset and copies it into the built site.
# See RELEASING.md for the full update/compile cycle.
[jinja2: **.html]
extensions = jinja2.ext.i18n

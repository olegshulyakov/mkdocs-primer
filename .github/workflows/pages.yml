name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

# Several docs plugins pull in properdocs, which prints a "switch to ProperDocs"
# banner whenever they run under the mkdocs executable. It only prints; this
# keeps it out of the logs. See #94.
env:
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mkdocs-git-revision-date-localized reads the log of every page.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # --group, which reads the docs dependencies from pyproject.toml, needs
      # pip 25.1 or newer.
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group docs
      - run: mkdocs build --strict
      # Published under /examples/. Must run after the main build, which cleans
      # site/.
      - run: mkdocs build --strict -f examples/rss/mkdocs.yml
      - run: mkdocs build --strict -f examples/gen-files/mkdocs.yml
      - run: mkdocs build --strict -f examples/diagrams/mkdocs.yml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

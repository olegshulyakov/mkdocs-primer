name: Release

on:
  push:
    tags: ['v*']

# Several docs plugins pull in properdocs, which prints a "switch to ProperDocs"
# banner whenever they run under the mkdocs executable. It only prints; this
# keeps it out of the logs. See #94.
env:
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # create the GitHub Release
      id-token: write # trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$package_version" = "$GITHUB_REF_NAME"
      - run: pip install build twine
      - run: pip install -e . -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: mkdocs build --strict -f examples/rss/mkdocs.yml
      - run: mkdocs build --strict -f examples/gen-files/mkdocs.yml
      - run: mkdocs build --strict -f examples/diagrams/mkdocs.yml
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke-venv/bin/mkdocs" new "$RUNNER_TEMP/smoke-site"
          printf 'theme:\n  name: primer\n' >> "$RUNNER_TEMP/smoke-site/mkdocs.yml"
          "$RUNNER_TEMP/smoke-venv/bin/mkdocs" build --strict -f "$RUNNER_TEMP/smoke-site/mkdocs.yml"
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md

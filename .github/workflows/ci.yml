name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  vendor:
    name: Vendored CSS and icons are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run vendor
      - name: Check for drift
        run: git diff --exit-code -- mkdocs_primer/css/vendor mkdocs_primer/partials/social-icons.html

  locales:
    name: Compiled catalogs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install --group i18n
      - run: pybabel compile -d mkdocs_primer/locales
      - name: Check for drift
        run: git diff --exit-code -- mkdocs_primer/locales

  minimum-python:
    name: Theme builds on Python 3.9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -e .
      - name: Build a plugin-free site
        run: |
          mkdocs new "$RUNNER_TEMP/smoke"
          printf 'theme:\n  name: primer\n' >> "$RUNNER_TEMP/smoke/mkdocs.yml"
          mkdocs build --strict -f "$RUNNER_TEMP/smoke/mkdocs.yml"

  docs:
    name: Docs site (full plugin stack, ${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [mkdocs, properdocs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group docs
      - run: npm ci
      - run: ${{ matrix.tool }} build --strict
      - run: ${{ matrix.tool }} build --strict -f examples/rss/mkdocs.yml
      - run: ${{ matrix.tool }} build --strict -f examples/gen-files/mkdocs.yml
      - run: ${{ matrix.tool }} build --strict -f examples/diagrams/mkdocs.yml
      - run: npm run build:offline
        if: matrix.tool == 'mkdocs'

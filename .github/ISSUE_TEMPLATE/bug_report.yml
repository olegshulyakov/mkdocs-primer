name: Bug report
description: Something in the theme renders, behaves, or builds incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: >
        The smallest site that shows the problem: the relevant part of `mkdocs.yml`,
        the page content, and the commands you ran. A link to a repository or a
        published page works too.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mkdocs-primer version
      description: Output of `pip show mkdocs-primer`.
      placeholder: 0.1.3
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: MkDocs and Python versions, the OS, and — for a visual problem — the browser.
      placeholder: "mkdocs 1.6.1, Python 3.13, macOS 15, Safari 18"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Build output
      description: >
        Any warnings or errors, ideally from `mkdocs build --strict`.
        This is formatted as code automatically.
      render: shell
    validations:
      required: false

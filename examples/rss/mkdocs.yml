site_name: MkDocs Primer Theme — RSS example
site_description: The primer theme emitting RSS autodiscovery links
site_url: https://olegshulyakov.github.io/mkdocs-primer/examples/rss/
repo_url: https://github.com/olegshulyakov/mkdocs-primer
edit_uri: edit/main/examples/rss/docs/
site_dir: ../../site/examples/rss

theme:
  name: primer

plugins:
  - search
  - rss:
      abstract_chars_count: 160
  - git-authors

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: ""
      permalink_class: anchor
      permalink_leading: true
  - pymdownx.highlight
  - pymdownx.superfences

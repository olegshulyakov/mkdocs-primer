<li class="primer-toc-item">
  <a class="primer-toc-link" href="{{ toc_item.url }}">{{ toc_item.title }}</a>
  {%- if toc_item.children %}
    <ul class="primer-toc-list" role="list">
      {%- for toc_item in toc_item.children %}
        {% include "partials/toc-item.html" %}
      {%- endfor %}
    </ul>
  {%- endif %}
</li>

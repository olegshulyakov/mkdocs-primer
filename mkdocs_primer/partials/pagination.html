{%- if page and (page.previous_page or page.next_page) %}
  <nav class="primer-pagination border-top mt-5 pt-3" aria-label="{% trans %}Page navigation{% endtrans %}">
    {%- if page.previous_page %}
      <a class="primer-pagination-prev" href="{{ page.previous_page.url | url }}" rel="prev">
        <span class="primer-pagination-label color-fg-muted">{% trans %}Previous{% endtrans %}</span>
        <span>{{ page.previous_page.title }}</span>
      </a>
    {%- endif %}
    {%- if page.next_page %}
      <a class="primer-pagination-next" href="{{ page.next_page.url | url }}" rel="next">
        <span class="primer-pagination-label color-fg-muted">{% trans %}Next{% endtrans %}</span>
        <span>{{ page.next_page.title }}</span>
      </a>
    {%- endif %}
  </nav>
{%- endif %}

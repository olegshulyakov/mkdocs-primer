# Default configuration for the `primer` theme.
# Override any of these under `theme:` in your mkdocs.yml.

# Templates rendered once for the whole site rather than per page.
static_templates:
  - 404.html

# The search plugin builds search.html for us and supplies search/main.js.
include_search_page: true
search_index_only: false

# Image shown next to the site name in the header. Path relative to docs_dir.
logo: null
favicon: img/favicon.svg

# Icon set used by the theme chrome. Supported values: `octicons` and `lucide`.
icon: octicons

# Optional typography overrides. `source` may be an absolute stylesheet URL or
# a stylesheet under docs_dir that declares local files with @font-face.
font:
  text: null
  code: null
  source: null

# Document direction. Supported values: `ltr` and `rtl`.
direction: ltr

# Chrome toggles.
include_sidebar: true
show_footer: true
# "Table of contents", the outline built from the headings of the current page.
#   auto       the right rail where the window has room for a third column,
#              otherwise in the flow under the page title — expanded either way
#   expanded   always in the flow, expanded; never takes the rail
#   collapsed  always in the flow, as a disclosure the reader opens
#   hidden     not rendered at all; `false` does the same
toc: auto
# Register a Workbox-generated service worker. The application using the theme
# must generate it as part of its site build; see the project offline example.
offline: false

# Color mode. `color_mode` is the initial default only — visitors can override
# it with the header toggle, and their choice is remembered in localStorage.
#   auto  follow the operating system
#   light always light
#   dark  always dark
color_mode: auto
# Only `light` and `dark` primitives ship with the theme today. Adding another
# Primer theme (dark_dimmed, *_high_contrast, ...) means vendoring one more file.
light_theme: light
dark_theme: dark

# Language of the theme chrome. Catalogs ship for the locales under locales/.
locale: en
